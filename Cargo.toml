[package]
name = "cfwp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Sn0wo2/vlpo-worker-rs"
publish = false

[workspace.dependencies]
mux-core = { path = "crates/mux-core" }
mux-cool-rs = { path = "crates/mux-cool-rs" }
smux-rs = { path = "crates/smux-rs" }
socksaddr = { path = "crates/socksaddr" }
yamux-rs = { path = "crates/yamux-rs" }

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[features]
default = ["dns", "proxy"]
proxy = [
  "dep:aes",
  "dep:chacha20poly1305",
  "dep:crc32fast",
  "dep:futures-channel",
  "dep:getrandom",
  "dep:hashlink",
  "dep:hex",
  "dep:hkdf",
  "dep:httparse",
  "dep:leb128",
  "dep:md5",
  "dep:mux-core",
  "dep:mux-cool-rs",
  "dep:percent-encoding",
  "dep:sha1",
  "dep:sha2",
  "dep:sha3",
  "dep:shake",
  "dep:shadowsocks-crypto",
  "dep:smux-rs",
  "dep:socksaddr",
  "dep:web-sys",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:yamux-rs",
]
dns = ["dep:domain", "dep:serde", "dep:serde_json", "dep:sha2"]

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = "debuginfo"
panic = "abort"

[dependencies]
acta = { version = "0.3.0", default-features = false, features = [
  "nerd",
  "wasm-console",
] }
aes = { version = "0.9", optional = true }
base64 = "0.23"
chacha20poly1305 = { version = "0.11", optional = true }
crc32fast = { version = "1", optional = true }
domain = { version = "0.12", default-features = false, features = [
  "std",
], optional = true }
futures-channel = { version = "0.3", optional = true }
futures-util = "0.3"
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }
hashlink = { version = "0.12.2", optional = true }
hkdf = { version = "0.13", optional = true }
hex = { version = "0.4", optional = true }
httparse = { version = "1", optional = true }
leb128 = { version = "0.2", optional = true }
js-sys = "0.3"
md5 = { version = "0.8.1", optional = true }
mux-core = { workspace = true, optional = true }
mux-cool-rs = { workspace = true, optional = true }
percent-encoding = { version = "2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha1 = { version = "0.11", optional = true }
sha3 = { version = "0.12", optional = true }
shake = { version = "0.1", optional = true }
sha2 = { version = "0.11", optional = true }
tokio = { version = "1", features = ["io-util", "sync"] }
uuid = "1"
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = [
  "AesGcmParams",
  "BinaryType",
  "Crypto",
  "CryptoKey",
  "SubtleCrypto",
  "WebSocket",
], optional = true }
worker = "0.8"
shadowsocks-crypto = { version = "0.8", default-features = false, features = [
  "v1-aead",
], optional = true }
smux-rs = { workspace = true, optional = true }
socksaddr = { workspace = true, optional = true }
yamux-rs = { workspace = true, optional = true }

[workspace.lints.rust]
unsafe_code = "forbid"
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
let_underscore = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
unused = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
missing_copy_implementations = "warn"
unreachable_pub = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
non_ascii_idents = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"
elided_lifetimes_in_paths = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
as_ptr_cast_mut = "warn"
assigning_clones = "warn"
branches_sharing_code = "warn"
cast_lossless = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"
clear_with_drain = "warn"
cloned_instead_of_copied = "warn"
collapsible_else_if = "warn"
collection_is_never_read = "warn"
comparison_chain = "warn"
dbg_macro = "warn"
default_trait_access = "warn"
elidable_lifetime_names = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
exhaustive_enums = "warn"
exhaustive_structs = "warn"
expect_used = "warn"
filter_map_bool_then = "warn"
filter_map_next = "warn"
get_unwrap = "warn"
if_not_else = "warn"
if_then_some_else_none = "warn"
indexing_slicing = "warn"
inline_asm_x86_att_syntax = "warn"
ip_constant = "warn"
iter_filter_is_ok = "warn"
iter_filter_is_some = "warn"
iter_on_empty_collections = "warn"
iter_with_drain = "warn"
literal_string_with_formatting_args = "warn"
macro_use_imports = "warn"
manual_assert = "warn"
manual_ilog2 = "warn"
manual_instant_elapsed = "warn"
manual_is_power_of_two = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
manual_midpoint = "warn"
map_unwrap_or = "warn"
match_wild_err_arm = "warn"
mem_forget = "warn"
mismatching_type_param_order = "warn"
missing_const_for_fn = "warn"
missing_panics_doc = "warn"
module_name_repetitions = "warn"
multiple_inherent_impl = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
naive_bytecount = "warn"
needless_collect = "warn"
needless_continue = "warn"
needless_pass_by_ref_mut = "warn"
needless_raw_strings = "warn"
needless_type_cast = "warn"
nonminimal_bool = "warn"
nonstandard_macro_braces = "warn"
option_as_ref_cloned = "warn"
option_if_let_else = "warn"
overly_complex_bool_expr = "warn"
panic = "warn"
panic_in_result_fn = "warn"
print_stderr = "warn"
print_stdout = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ptr_offset_by_literal = "warn"
pub_use = "warn"
pub_without_shorthand = "warn"
range_minus_one = "warn"
range_plus_one = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
redundant_type_annotations = "warn"
ref_as_ptr = "warn"
ref_binding_to_reference = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_length_and_capacity = "warn"
self_named_module_files = "warn"
set_contains_or_insert = "warn"
significant_drop_tightening = "warn"
single_call_fn = "warn"
single_char_pattern = "warn"
stable_sort_primitive = "warn"
str_split_at_newline = "warn"
string_add = "warn"
string_lit_as_bytes = "warn"
struct_field_names = "warn"
suboptimal_flops = "warn"
suspicious_operation_groupings = "warn"
suspicious_xor_used_as_pow = "warn"
todo = "warn"
trivial_regex = "warn"
tuple_array_conversions = "warn"
type_repetition_in_bounds = "warn"
unchecked_time_subtraction = "warn"
unimplemented = "warn"
uninlined_format_args = "warn"
unnecessary_box_returns = "warn"
unnecessary_debug_formatting = "warn"
unnecessary_join = "warn"
unnecessary_semicolon = "warn"
unnecessary_struct_initialization = "warn"
unnecessary_trailing_comma = "warn"
unnecessary_wraps = "warn"
unneeded_field_pattern = "warn"
unnested_or_patterns = "warn"
unreachable = "warn"
unreadable_literal = "warn"
unseparated_literal_suffix = "warn"
unused_async = "warn"
unused_peekable = "warn"
unused_self = "warn"
unwrap_used = "warn"
use_debug = "warn"
use_self = "warn"
used_underscore_items = "warn"
useless_let_if_seq = "warn"
verbose_bit_mask = "warn"
verbose_file_reads = "warn"
zero_sized_map_values = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
invalid_codeblock_attributes = "warn"
bare_urls = "warn"
unescaped_backticks = "warn"
