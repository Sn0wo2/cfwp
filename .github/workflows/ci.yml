name: Rust CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Run lint checks
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: write
      pull-requests: write

  worker:
    name: Build Cloudflare Worker
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: workspace/cfwp
      - uses: ./workspace/cfwp/.github/actions/setup-worker
      - name: Build Worker
        working-directory: workspace/cfwp
        run: make build
      - name: Validate Worker bundle
        working-directory: workspace/cfwp
        run: wrangler deploy --dry-run --config build/wrangler.toml
      - name: Package Pages artifact
        working-directory: workspace/cfwp
        run: node scripts/package-pages.js

  test:
    name: Run tests
    uses: ./.github/workflows/test.yml
