name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: workspace/cfwp

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: workspace/cfwp

      - uses: ./workspace/cfwp/.github/actions/setup-rust

      - name: Apply lint fixes
        continue-on-error: true
        run: |
          cargo fmt-all
          cargo lint-fix

      - name: Save lint fixes
        id: patch
        if: ${{ !cancelled() }}
        run: |
          if ! git diff --quiet -- '*.rs'; then
            git diff --binary -- '*.rs' > "$RUNNER_TEMP/lint-fixes.patch"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git restore --worktree -- '*.rs'
          fi

      - run: |
          cargo fmt-check
          cargo lint
          cargo check-ws
          cargo check-no-default
          cargo test-ws
          cargo test-all-features
          cargo test-no-default
          cargo doc-all

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - run: cargo security

      - name: Checkout the branch for autofix
        id: autofix_checkout
        if: >-
          !cancelled() && steps.patch.outputs.changed == 'true' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false
          path: workspace/cfwp

      - name: Apply lint fixes
        id: apply_fix
        if: ${{ !cancelled() && steps.autofix_checkout.outcome == 'success' }}
        run: git apply --include='*.rs' "$RUNNER_TEMP/lint-fixes.patch"

      - name: Create autofix pull request
        id: autofix_pr
        continue-on-error: true
        if: ${{ !cancelled() && steps.apply_fix.outcome == 'success' }}
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: workspace/cfwp
          commit-message: "chore(autofix): formatting and lint"
          branch: auto-fix/rust-${{ github.event.pull_request.number || github.ref_name }}
          delete-branch: true
          title: "chore(autofix): formatting and lint"
          body: "Automated rustfmt and Clippy fixes from CI"
          labels: automated,rust
          add-paths: "**/*.rs"

      - name: Upload lint fixes if pull request creation fails
        if: ${{ !cancelled() && steps.autofix_pr.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-fixes
          path: ${{ runner.temp }}/lint-fixes.patch
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build Cloudflare Worker
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
          path: workspace/cfwp

      - uses: ./workspace/cfwp/.github/actions/build
        with:
          snapshot: 'true'
          profile: debug

  geiger:
    name: Unsafe code report
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: workspace/cfwp

      - uses: ./workspace/cfwp/.github/actions/setup-rust

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-geiger

      - name: Scan unsafe code
        continue-on-error: true
        run: cargo geiger --all-features --output-format GitHubMarkdown >> "$GITHUB_STEP_SUMMARY"
