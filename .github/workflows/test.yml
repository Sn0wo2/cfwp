name: Rust Tests

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: workspace/cfwp

jobs:
  test:
    name: Test feature configurations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: workspace/cfwp
      - uses: ./workspace/cfwp/.github/actions/setup-rust
      - name: Run tests
        run: make test test-all test-no-default
