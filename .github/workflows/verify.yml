name: Verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: workspace/cfwp
      - uses: ./workspace/cfwp/.github/actions/setup-rust
      - name: Check formatting
        working-directory: workspace/cfwp
        run: cargo fmt --all -- --check
  wasm:
    name: Wasm (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            feature_args: ""
          - name: dns
            feature_args: --no-default-features --features dns
          - name: proxy
            feature_args: --no-default-features --features proxy
    steps:
      - uses: actions/checkout@v7
        with:
          path: workspace/cfwp
      - uses: ./workspace/cfwp/.github/actions/setup-rust
      - name: Check wasm32
        working-directory: workspace/cfwp
        run: cargo check --workspace --target wasm32-unknown-unknown ${{ matrix.feature_args }}
      - name: Run Clippy
        working-directory: workspace/cfwp
        run: cargo clippy --workspace --target wasm32-unknown-unknown --all-targets ${{ matrix.feature_args }} -- -D warnings
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: workspace/cfwp
      - uses: ./workspace/cfwp/.github/actions/setup-rust
      - name: Run tests
        working-directory: workspace/cfwp
        run: cargo test --workspace --exclude cfwp
  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: workspace/cfwp
      - uses: ./workspace/cfwp/.github/actions/setup-rust
      - name: Check documentation
        working-directory: workspace/cfwp
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --target wasm32-unknown-unknown --no-deps --all-features
  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: workspace/cfwp
      - uses: ./workspace/cfwp/.github/actions/setup-rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Run cargo-deny
        working-directory: workspace/cfwp
        run: cargo deny check
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: workspace/cfwp
      - uses: ./workspace/cfwp/.github/actions/setup-rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run cargo-audit
        working-directory: workspace/cfwp
        run: cargo audit
  geiger:
    name: Cargo Geiger
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          path: workspace/cfwp
      - uses: ./workspace/cfwp/.github/actions/setup-rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-geiger
      - name: Run cargo-geiger
        working-directory: workspace/cfwp
        run: cargo geiger --all-features --output-format GitHubMarkdown > geiger-report.md 2>&1 || true
      - name: Upload Geiger report
        uses: actions/upload-artifact@v7
        with:
          name: geiger-report-${{ github.sha }}
          path: workspace/cfwp/geiger-report.md
          retention-days: 30
      - name: Add Geiger summary
        working-directory: workspace/cfwp
        run: |
          {
            echo '## Cargo Geiger Report'
            echo '```'
            tail -n 50 geiger-report.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
