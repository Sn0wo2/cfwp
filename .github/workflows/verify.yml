name: Verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: workspace/cfwp
      - uses: ./workspace/cfwp/.github/actions/setup-rust
      - name: Check formatting
        working-directory: workspace/cfwp
        run: make fmt-check
  wasm:
    name: Wasm (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            make_target: default
          - name: dns
            make_target: dns
          - name: proxy
            make_target: proxy
    steps:
      - uses: actions/checkout@v7
        with:
          path: workspace/cfwp
      - uses: ./workspace/cfwp/.github/actions/setup-rust
      - name: Check wasm32
        working-directory: workspace/cfwp
        run: make check-${{ matrix.make_target }}
      - name: Run Clippy
        working-directory: workspace/cfwp
        run: make clippy-${{ matrix.make_target }}
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: workspace/cfwp
      - uses: ./workspace/cfwp/.github/actions/setup-rust
      - name: Run tests
        working-directory: workspace/cfwp
        run: make test
  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: workspace/cfwp
      - uses: ./workspace/cfwp/.github/actions/setup-rust
      - name: Check documentation
        working-directory: workspace/cfwp
        run: make doc
  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: workspace/cfwp
      - uses: ./workspace/cfwp/.github/actions/setup-rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Run cargo-deny
        working-directory: workspace/cfwp
        run: make deny
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: workspace/cfwp
      - uses: ./workspace/cfwp/.github/actions/setup-rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run cargo-audit
        working-directory: workspace/cfwp
        run: make audit
  geiger:
    name: Cargo Geiger
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          path: workspace/cfwp
      - uses: ./workspace/cfwp/.github/actions/setup-rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-geiger
      - name: Run cargo-geiger
        working-directory: workspace/cfwp
        run: cargo geiger --all-features --output-format GitHubMarkdown > geiger-report.md 2>&1 || true
      - name: Upload Geiger report
        uses: actions/upload-artifact@v7
        with:
          name: geiger-report-${{ github.sha }}
          path: workspace/cfwp/geiger-report.md
          retention-days: 30
      - name: Add Geiger summary
        working-directory: workspace/cfwp
        run: |
          {
            echo '## Cargo Geiger Report'
            echo '```'
            tail -n 50 geiger-report.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
