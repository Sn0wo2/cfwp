name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Cloudflare deployment target
        required: true
        type: choice
        default: worker
        options:
          - worker
          - pages

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: workspace/cfwp
      - uses: ./workspace/cfwp/.github/actions/setup-worker
      - name: Prepare Wrangler configuration
        working-directory: workspace/cfwp
        env:
          TARGET: ${{ inputs.target }}
        run: |
          cp wrangler.example.toml wrangler.toml
          if [ "$TARGET" = pages ]; then
            sed -i '/^\[build\]/,$d' wrangler.toml
          else
            sed -i 's|make build-dev|make build|' wrangler.toml
          fi
      - name: Check Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build and package Pages
        if: inputs.target == 'pages'
        working-directory: workspace/cfwp
        run: |
          make build
          node scripts/package-pages.js
      - name: Deploy Worker
        if: inputs.target == 'worker'
        working-directory: workspace/cfwp
        run: wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Pages
        if: inputs.target == 'pages'
        working-directory: workspace/cfwp
        run: wrangler pages deploy --cwd pages public --project-name cfwp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
