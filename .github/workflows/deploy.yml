name: Deploy

on:
  workflow_dispatch:
    inputs:
      features:
        description: Worker feature set
        required: true
        type: choice
        options:
          - proxy
          - dns
          - dns,proxy

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: workspace/cfwp
      - uses: ./workspace/cfwp/.github/actions/setup-worker
      - name: Prepare Wrangler configuration
        working-directory: workspace/cfwp
        run: |
          cp wrangler.example.toml wrangler.toml
          sed -i 's|node scripts/build.js dev|node scripts/build.js release|' wrangler.toml
      - name: Check Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        working-directory: workspace/cfwp
        run: wrangler deploy --config wrangler.toml
        env:
          CFWP_FEATURES: ${{ inputs.features }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
