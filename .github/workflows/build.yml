name: Build

on:
  workflow_call:
    inputs:
      ref:
        type: string
      version:
        type: string
      snapshot:
        type: boolean
        default: true

permissions: {}

env:
  JS_RUNTIME: node

defaults:
  run:
    working-directory: workspace/cfwp

jobs:
  worker:
    name: Build Cloudflare Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
          path: workspace/cfwp
      - uses: ./workspace/cfwp/.github/actions/setup-worker
      - name: Install cargo-edit
        if: ${{ !inputs.snapshot }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit
      - name: Sync workspace version
        if: ${{ !inputs.snapshot }}
        run: cargo set-version --workspace "$VERSION"
        env:
          VERSION: ${{ inputs.version }}
      - name: Build Worker
        run: make build
      - name: Validate Worker bundle
        run: wrangler deploy --dry-run --config build/wrangler.toml
      - name: Package Pages Worker
        run: |
          node scripts/package-pages.js
          mkdir -p dist
          tar -czf dist/cfwp-pages-worker.tar.gz -C pages/public .
      - name: Upload Worker artifact
        uses: actions/upload-artifact@v7
        with:
          name: worker-artifact
          path: workspace/cfwp/dist/cfwp-pages-worker.tar.gz
          if-no-files-found: error
          retention-days: ${{ inputs.snapshot && 7 || 30 }}
