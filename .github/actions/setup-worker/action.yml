name: Set up Worker build tools
description: Install worker-build, Binaryen, and Wrangler
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-rust
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Install worker-build
      shell: bash
      run: cargo install worker-build --version 0.9.0 --locked
    - name: Install Wrangler
      shell: bash
      run: npm install --global wrangler@4
    - name: Verify build tools
      shell: bash
      run: worker-build --version
    - name: Verify Wrangler
      shell: bash
      run: wrangler --version
