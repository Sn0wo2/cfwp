name: Set up Rust workspace
description: Install the pinned Rust toolchain and cache the workspace Cargo build
runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      shell: bash
      run: rustup show
    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: cfwp-nightly
        cache-workspace-crates: true
        save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
