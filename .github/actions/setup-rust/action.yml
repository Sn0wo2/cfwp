name: Set up Rust workspace
description: Install the pinned Rust toolchain and cache the workspace Cargo build
runs:
  using: composite
  steps:
    - uses: ./workspace/cfwp/.github/actions/setup-path-dependencies
    - name: Install Rust toolchain
      shell: bash
      working-directory: workspace/cfwp
      run: |
        toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
        test -n "$toolchain"
        rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy --component rust-src --target wasm32-unknown-unknown
        echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: workspace/cfwp -> target
        shared-key: cfwp-nightly
        cache-on-failure: true
